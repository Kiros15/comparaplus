<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel privado — ComparaPlus</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="admin.css"></head><body>
<div class="shell"><header><a href="../"><img src="../assets/logo.svg" alt="ComparaPlus"></a><div><span id="userEmail"></span><button id="logout" class="ghost">Cerrar sesión</button></div></header>
<main><section id="login" class="panel narrow"><h1>Panel privado</h1><p>Gestiona productos, condiciones, enlaces y visibilidad.</p><form id="loginForm"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Contraseña<input id="password" type="password" required autocomplete="current-password"></label><button>Entrar</button><p id="loginMsg" class="msg"></p></form></section>
<section id="dashboard" hidden><div class="top"><div><span class="kicker">ADMINISTRACIÓN</span><h1>Productos financieros</h1><p>CRUD conectado a Supabase con control de acceso.</p></div><button id="newBtn">+ Nuevo producto</button></div><div class="stats"><div><b id="countAll">0</b><span>productos</span></div><div><b id="countActive">0</b><span>activos</span></div><div><b id="countFeatured">0</b><span>destacados</span></div></div><div class="toolbar"><input id="search" placeholder="Buscar entidad o producto…"><select id="cat"><option value="">Todas</option><option>Hipotecas</option><option>Préstamos</option><option>Cuentas</option><option>Tarjetas</option><option>Depósitos</option><option>Seguros</option></select></div><div id="tableWrap"></div></section></main></div>
<div id="modal" class="modal" hidden><div class="modal-card"><button type="button" id="close" class="close" aria-label="Cerrar">×</button><h2 id="modalTitle">Nuevo producto</h2><form id="productForm"><input id="pid" type="hidden"><div class="grid"><label>Nombre<input id="name" required></label><label>Entidad<input id="bank" required></label><label>Categoría<select id="pcat" required><option>Hipotecas</option><option>Préstamos</option><option>Cuentas</option><option>Tarjetas</option><option>Depósitos</option><option>Seguros</option></select></label><label>Tipo<input id="type"></label><label>TIN<input id="tin"></label><label>TAE<input id="tae"></label><label>Plazo<input id="term"></label><label>Comisiones<input id="fee"></label><label>Importe mínimo<input id="min" type="number"></label><label>Importe máximo<input id="max" type="number"></label><label class="wide">Destacado<input id="highlight"></label><label class="wide">Requisitos<textarea id="requirements"></textarea></label><label>URL oficial<input id="url" type="url"></label><label>URL afiliado<input id="affiliate" type="url"></label><label>Fuente<input id="source"></label><label>Verificado<input id="verified" type="date"></label></div><div class="checks"><label><input id="active" type="checkbox" checked> Activo</label><label><input id="featured" type="checkbox"> Destacado</label></div><button type="submit">Guardar producto</button><p id="formMsg" class="msg"></p></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="admin.js"></script></body></html>
